services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: the temporary server that runs init scripts is socket-only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U orbit -d orbit"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
